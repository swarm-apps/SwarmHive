name: Server Release

# server 的独立发布线，与 CLI(cli/v*)、SDK(sdk/v*)三足解耦。
# 一条 server/v* tag 同时产出：
#   ① GHCR 多架构镜像 ghcr.io/<owner>/swarmhive-server (linux/amd64 + linux/arm64)
#   ② GitHub Release 上的 Linux x86_64/aarch64 单文件二进制 tar.gz(内嵌 admin SPA)
# 镜像/二进制均用 --features embed-spa 把 apps/admin/dist 经 rust-embed 嵌入二进制。
on:
  push:
    tags:
      - "server/v*"
  workflow_dispatch: {}

concurrency:
  group: server-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # GHCR 镜像名必须全小写;github.repository_owner = swarm-apps。
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/swarmhive-server

# 注:下面 arm64 用 `ubuntu-24.04-arm` —— GitHub 自 2025 年为**公开仓库**免费 GA 的
# ARM64 Linux hosted runner(swarm-apps/swarmhive 是开源公开仓库,可直接用)。若本仓库
# 转为私有,免费 arm64 runner 不可用,需改用付费 larger runner 或自托管 arm64 runner
# (相应改这两个矩阵的 runner label)。
jobs:
  # ── 多架构镜像 ──
  # 两个 native runner 各自构建并按 digest push(push-by-digest),再由 merge job
  # 用 imagetools 合成一份 manifest list 打上语义化 tag。避免在单 runner 上用 QEMU
  # 模拟 arm64(LTO release 构建在模拟下极慢)。
  image-build:
    name: Image ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-image-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image-merge:
    name: Image manifest merge
    runs-on: ubuntu-latest
    needs: [image-build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # server/v1.2.3 → 1.2.3 + 1.2 + latest + sha-xxxxxxx
          tags: |
            type=match,pattern=server/v(\d+\.\d+\.\d+),group=1
            type=match,pattern=server/v(\d+\.\d+),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/server/v') }}
            type=sha,format=short

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  # ── 单文件二进制(挂 GitHub Release) ──
  # native runner 直接产 host 三元组,无需 cross。内嵌 SPA(--features embed-spa)。
  binaries:
    name: Binary ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build admin SPA (for embed-spa)
        run: |
          pnpm install --frozen-lockfile
          pnpm admin:build

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install build deps (cmake for aws-lc-sys)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake

      - name: Build server (release, embed-spa)
        run: cargo build --release -p swarmhive-server --bin swarmhive-server --features embed-spa

      - name: Package tarball
        id: package
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#server/}"   # server/v1.2.3 → v1.2.3(dispatch 时取分支名)
          name="swarmhive-server-${ver}-${{ matrix.target }}"
          staging="dist/${name}"
          mkdir -p "${staging}/config"
          cp target/release/swarmhive-server "${staging}/"
          cp config/default.toml "${staging}/config/"
          tar -C dist -czf "${name}.tar.gz" "${name}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "archive=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/server/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          fail_on_unmatched_files: true
