# SwarmHive —— Coolify 部署模板(直连 IP 版)。
#
# 在 Coolify 里新建资源 → 选 "Docker Compose" → 粘贴本文件。
# 默认**直连服务器 IP 访问**:server 发布到宿主机 :3030,不经 Coolify 域名/反代 —— 适合没有
# 域名、或 Coolify 分配的 sslip.io 域名在国内不可达的场景。Coolify 仍会自动生成并持久化
# DB / 存储的随机密钥(SERVICE_PASSWORD_* / SERVICE_USER_*,与域名无关)。
#
# 你需要在 Coolify 的环境变量里手动填 **两个** 值:
#   1. SWARMHIVE_SECRET_KEY      = `openssl rand -base64 32`(base64 的 32 字节,加密落库密文用;
#                                  **一次设定后固定不变并备份**,换了会让已加密数据再也解不开)。
#   2. SWARMHIVE_SERVER__BASE_URL = http://<你的服务器IP>:3030(对外地址,拼邮件链接用)。
#
# 别忘了在**云服务器安全组放行 3030**。首启后访问 http://<你的服务器IP>:3030 → /setup 建 Owner;
# 再用 admin 存储向导接入 RustFS(endpoint 填 http://rustfs:9000)。
#
# ── 我有域名、想用 Coolify 域名 + Let's Encrypt TLS ─────────────────────────────
# 把下面 server 的 environment 第一项换回 `- SERVICE_FQDN_SERVER_3030`、BASE_URL 改成
# `- SWARMHIVE_SERVER__BASE_URL=$SERVICE_URL_SERVER_3030`,并把 `ports: ["3030:3030"]` 换回
# `expose: ["3030"]`。然后安全组放行 80/443(而非 3030),Coolify 会自动出域名 + 证书。

services:
  server:
    image: ghcr.io/swarm-apps/swarmhive-server:latest
    environment:
      # 对外地址(拼邮件链接用)。直连 IP 版:在 Coolify 环境变量里填 http://<你的服务器IP>:3030。
      # 有域名想走 Coolify 域名 + TLS:见文件头部说明,改回 SERVICE_FQDN + SERVICE_URL。
      - SWARMHIVE_SERVER__BASE_URL=$SWARMHIVE_SERVER__BASE_URL
      # DB 连接串复用 Coolify 为 postgres 生成的同名随机密码。
      - SWARMHIVE_DATABASE__URL=postgres://swarmhive:$SERVICE_PASSWORD_POSTGRES@postgres:5432/swarmhive
      # 生产不跑 schema-sync;启动期只跑 swarmhive-migration ledger。
      - SWARMHIVE_DATABASE__AUTO_SYNC=false
      # ⚠️ 必填且必须稳定:Coolify 会把它显示为可填环境变量。值 = `openssl rand -base64 32`。
      - SWARMHIVE_SECRET_KEY=$SWARMHIVE_SECRET_KEY
      # 生产关掉 dev mailpit seed;首启后在 admin 里配真实 SMTP。
      - SWARMHIVE_MAIL__SEED_MAILPIT_IN_DEV=false
      # 可选:钉死首启 Owner 邮箱(公开部署推荐),Coolify 里留空则不限制。
      - SWARMHIVE_BOOTSTRAP_OWNER_EMAIL=$SWARMHIVE_BOOTSTRAP_OWNER_EMAIL
    ports:
      # 直接发布到宿主机 :3030 —— 记得在云服务器安全组放行 3030。
      - "3030:3030"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      - POSTGRES_USER=swarmhive
      - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
      - POSTGRES_DB=swarmhive
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarmhive"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── 存储:自带 RustFS(可选)──
  # SwarmHive 存储是 S3-only;RustFS 只是「单机自带存储」一个选项。已有 S3 / R2 / MinIO / OSS,
  # 就删掉 rustfs + rustfs-init 两个 service(server 不依赖它们),首启后在向导里填你的 S3。
  rustfs:
    image: rustfs/rustfs:latest
    command: ["/data"]
    environment:
      - RUSTFS_ACCESS_KEY=$SERVICE_USER_RUSTFS
      - RUSTFS_SECRET_KEY=$SERVICE_PASSWORD_RUSTFS
    volumes:
      - rustfs-data:/data

  # 一次性容器:等 RustFS 就绪后预建 bucket(server 探测/上传不会自动建桶)。
  rustfs-init:
    image: minio/mc:latest
    environment:
      # $SERVICE_* 由 Coolify 在部署时插值进容器 env;脚本里用 $$ 转义在运行时再读。
      - RFS_ACCESS=$SERVICE_USER_RUSTFS
      - RFS_SECRET=$SERVICE_PASSWORD_RUSTFS
    depends_on:
      - rustfs
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set rfs http://rustfs:9000 "$$RFS_ACCESS" "$$RFS_SECRET" >/dev/null 2>&1; do
          echo 'waiting for rustfs...'; sleep 1;
        done
        mc mb --ignore-existing rfs/swarmhive
        echo "bucket swarmhive ready"
    restart: "no"

volumes:
  pg-data:
  rustfs-data:
