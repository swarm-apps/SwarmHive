[workspace]
members = [
    "crates/swarmhive-api-types",
    "crates/swarmhive-entity",
    "crates/swarmhive-server",
    "crates/swarmhive-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/swarm-apps/swarmhive"
homepage = "https://github.com/swarm-apps/swarmhive"
rust-version = "1.94"

[workspace.dependencies]
# Internal crates
# api-types 带 version：cargo publish swarmhive-cli 到 crates.io 时，path 依赖必须有 version
# 才能解析成 crates.io 上的版本依赖（path 仅本地构建用）。version 必须与 api-types 实际版本兼容。
swarmhive-api-types = { path = "crates/swarmhive-api-types", version = "0.1.0" }
swarmhive-entity = { path = "crates/swarmhive-entity" }

# HTTP server
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
hyper = "1"

# Async runtime
tokio = { version = "1", features = ["sync", "time", "macros", "fs", "rt-multi-thread", "signal"] }
tokio-util = "0.7"

# CLI
clap = { version = "4", features = ["derive", "env"] }
indicatif = "0.17"
directories = "5"
rpassword = "7"
hostname = "0.4"
webbrowser = "1"
tabled = "0.17"

# HTTP client. `rustls-tls-native-roots` trusts the OS cert store (enterprise /
# self-signed CAs); `swarmhive --ca-cert` / `SWARMHIVE_CA_CERT` adds extra roots.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }

# S3 / storage
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"

# Identifiers / dates
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Errors
thiserror = "2"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Hashing
argon2 = "0.5"
blake3 = "1"
# sha2 + md-5 (RustCrypto) MUST stay on the same major so they share one
# `digest` (the Content-MD5 gate computes Md5 via the `Digest` trait re-exported
# alongside Sha256). md-5 is used for the Content-MD5 upload-integrity gate
# (universal across S3 clones, incl. Aliyun OSS). NOTE: aws-sdk-s3 / sqlx /
# argon2 still pull sha2 0.10 transitively, so both majors coexist in the tree.
sha2 = "0.11"
md-5 = "0.11"

# Semantic-version comparison (Tauri update-check: min_version / current_version)
semver = "1"

# Symmetric encryption (mail provider password storage)
aes-gcm = "0.10"

# SMTP mail delivery
lettre = { version = "0.11", default-features = false, features = [
    "tokio1-rustls-tls",
    "smtp-transport",
    "builder",
    "tracing",
] }

# Runtime-loaded email templates
minijinja = "2"

# Auth / session
tower-sessions = "0.15"
tower_governor = "0.8"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
# OAuth 2.0 client (GitHub sign-in). rustls to match the repo-wide reqwest TLS;
# `reqwest` feature gives the async http client used for token exchange.
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }

# Concurrency
async-trait = "0.1"
futures = "0.3"
dashmap = "6"

# Retry with exponential backoff + jitter (CLI upload transient failures)
backon = "1"

# Static embed for admin SPA
rust-embed = "8"
mime_guess = "2"

# OpenAPI + validation (shared by api-types)
utoipa = { version = "5", features = ["chrono", "uuid"] }
utoipa-axum = "0.2"
utoipa-redoc = { version = "6", features = ["axum"] }
garde = { version = "0.22", features = ["full"] }

# Database (Postgres only; schema-sync only, no migration crate)
sea-orm = { version = "=2.0.0-rc.38", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "with-uuid",
    "with-chrono",
    "with-json",
    "macros",
    "debug-print",
    "entity-registry",
    "schema-sync",
] }
# NOTE: no direct `sqlx` dependency — sea-orm pulls sqlx 0.8 transitively with
# all the features we need (sqlx-postgres / runtime-tokio-rustls / with-uuid /
# with-chrono / with-json map onto sqlx's postgres/rustls/uuid/chrono/json), and
# no crate calls `sqlx::` directly (only sea-orm's `ConnectOptions::sqlx_logging`,
# which is sea-orm API). Re-add here only if we ever need to pin sqlx ourselves.

# Config (figment: toml + env layered)
figment = { version = "0.10", features = ["toml", "env"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
