[workspace]
members = [
    "crates/swarmhive-api-types",
    "crates/swarmhive-entity",
    "crates/swarmhive-server",
    "crates/swarmhive-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/swarm-apps/swarmhive"
rust-version = "1.94"

[workspace.dependencies]
# Internal crates
swarmhive-api-types = { path = "crates/swarmhive-api-types" }
swarmhive-entity = { path = "crates/swarmhive-entity" }

# HTTP server
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
hyper = "1"

# Async runtime
tokio = { version = "1", features = ["sync", "time", "macros", "fs", "rt-multi-thread", "signal"] }
tokio-util = "0.7"

# CLI
clap = { version = "4", features = ["derive", "env"] }
indicatif = "0.17"
directories = "5"
rpassword = "7"
hostname = "0.4"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }

# S3 / storage
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"

# Identifiers / dates
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Errors
thiserror = "2"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Hashing
argon2 = "0.5"
blake3 = "1"
sha2 = "0.10"

# Auth / session
tower-sessions = "0.15"
tower_governor = "0.8"
rand = "0.8"
base64 = "0.22"

# Concurrency
async-trait = "0.1"
futures = "0.3"
dashmap = "6"

# Static embed for admin SPA
rust-embed = "8"
mime_guess = "2"

# OpenAPI + validation (shared by api-types)
utoipa = { version = "5", features = ["chrono", "uuid"] }
utoipa-axum = "0.2"
utoipa-redoc = { version = "6", features = ["axum"] }
garde = { version = "0.22", features = ["full"] }

# Database (Postgres only; schema-sync only, no migration crate)
sea-orm = { version = "=2.0.0-rc.38", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "with-uuid",
    "with-chrono",
    "with-json",
    "macros",
    "debug-print",
    "entity-registry",
    "schema-sync",
] }
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "runtime-tokio-rustls",
    "uuid",
    "chrono",
    "json",
] }

# Config (figment: toml + env layered)
figment = { version = "0.10", features = ["toml", "env"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
