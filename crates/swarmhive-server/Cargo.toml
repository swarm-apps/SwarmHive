[package]
name = "swarmhive-server"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "SwarmHive HTTP server: control plane, update endpoints, embedded admin SPA."

[lib]
name = "swarmhive_server"
path = "src/lib.rs"

[[bin]]
name = "swarmhive-server"
path = "src/bin/server.rs"

[[bin]]
name = "dump-openapi"
path = "src/bin/dump_openapi.rs"

[dependencies]
swarmhive-api-types.workspace = true
swarmhive-entity.workspace = true

axum.workspace = true
tower.workspace = true
tower-http.workspace = true
tokio.workspace = true

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true

rust-embed.workspace = true
mime_guess.workspace = true

sea-orm.workspace = true
sqlx.workspace = true
figment.workspace = true

chrono.workspace = true
uuid.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
utoipa-redoc.workspace = true

# Auth
argon2.workspace = true
blake3.workspace = true
tower-sessions.workspace = true
tower_governor.workspace = true
rand.workspace = true
base64.workspace = true
garde.workspace = true
async-trait.workspace = true
time.workspace = true

# Mail (lettre SMTP transport + minijinja runtime templates + AES-GCM at-rest)
lettre.workspace = true
minijinja.workspace = true
aes-gcm.workspace = true

[dev-dependencies]
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
serde_json.workspace = true

[lints]
workspace = true
