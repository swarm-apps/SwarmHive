[package]
name = "swarmhive-server"
version = "0.7.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "SwarmHive HTTP server: control plane, update endpoints, embedded admin SPA."

# The server is distributed as a container / source build, NOT through cargo-dist.
# Without this, `dist` auto-discovers the `swarmhive-server` / `dump-openapi`
# binaries and ships them alongside the CLI (the `[workspace] members` allowlist
# in dist-workspace.toml does not by itself restrict the cargo workspace).
[package.metadata.dist]
dist = false

[features]
# 把构建好的 admin SPA(`apps/admin/dist`)经 rust-embed 内嵌进二进制并挂 SPA fallback。
# 默认关闭:`#[derive(RustEmbed)]` 在 dist 不存在时编译期报错,而 dev/CI/集成测试普遍
# 没构建过 SPA。容器镜像与发布二进制构建显式 `--features embed-spa`(构建前已 pnpm admin:build)。
embed-spa = []

[lib]
name = "swarmhive_server"
path = "src/lib.rs"

[[bin]]
name = "swarmhive-server"
path = "src/bin/server.rs"

[[bin]]
name = "dump-openapi"
path = "src/bin/dump_openapi.rs"

[dependencies]
swarmhive-api-types.workspace = true
swarmhive-entity.workspace = true
swarmhive-migration.workspace = true

axum.workspace = true
tower.workspace = true
tower-http.workspace = true
tokio.workspace = true

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true

rust-embed.workspace = true
mime_guess.workspace = true

sea-orm.workspace = true
figment.workspace = true

chrono.workspace = true
uuid.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
utoipa-redoc.workspace = true

# Auth
argon2.workspace = true
blake3.workspace = true
# 更新检查:semver 比较(min_version / current_version)+ blake3 灰度分桶
semver.workspace = true
tower-sessions.workspace = true
tower_governor.workspace = true
rand.workspace = true
base64.workspace = true
garde.workspace = true
async-trait.workspace = true
time.workspace = true
oauth2.workspace = true
# GitHub /user + /user/emails calls during OAuth exchange. Same reqwest 0.12 as
# oauth2's http client (cargo unifies), so `request_async(&reqwest::Client)` works.
reqwest.workspace = true

# Mail (lettre SMTP transport + minijinja runtime templates + AES-GCM at-rest)
lettre.workspace = true
minijinja.workspace = true
aes-gcm.workspace = true

# Storage (S3-compatible presign + complete)
aws-config.workspace = true
aws-sdk-s3.workspace = true
hex.workspace = true
sha2.workspace = true

# Notifications (Standard Webhooks v1 HMAC-SHA256 signing)
hmac.workspace = true

[dev-dependencies]
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres", "minio"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
# Mock GitHub's OAuth token + user endpoints in oauth_smoke.
wiremock = "0.6"
serde_json.workspace = true
# Real presigned PUT against the MinIO testcontainer in storage_smoke.
reqwest.workspace = true
sha2.workspace = true
md-5.workspace = true

[lints]
workspace = true
